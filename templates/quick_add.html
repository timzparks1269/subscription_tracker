<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Subscription?</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 380px; margin: 30px auto; padding: 0 16px; background: #f5f7fa; color: #222; }
        .popup { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        h2 { margin: 0 0 6px 0; font-size: 20px; }
        p { margin: 0 0 18px 0; font-size: 14px; color: #666; }
        input, select { width: 100%; box-sizing: border-box; padding: 11px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        label.trial { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; background: #fff4e5; padding: 10px; border-radius: 8px; }
        label.trial input { width: auto; margin: 0; }
        .btns { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .yes { background: #007aff; color: white; }
        .no { background: #e5e5ea; color: #222; }
    </style>
</head>
<body>
    <div class="popup">
        <h2>Record this subscription?</h2>
        <p>Confirm or adjust details before saving to your tracker.</p>
        <form method="POST">
            <input type="text" name="name" placeholder="Service Name" value="{{ name }}" required>
            <input type="number" step="0.01" min="0" name="price" placeholder="Price (e.g. 9.99)" value="{{ price }}" required>
            <select name="cycle">
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
            <input type="date" name="next_date" value="{{ default_date }}" required>
            <label class="trial">
                <input type="checkbox" name="is_trial"> Free Trial
            </label>
            <div class="btns">
                <button class="yes" type="submit">Yes, Record</button>
                <button class="no" type="button" onclick="window.close()">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
